name: Refresh ECI feed and deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch official ECI announcements
        id: refresh_feed
        continue-on-error: true
        run: node scripts/update-eci-feed.js

      - name: Save updated feed to repository
        if: steps.refresh_feed.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/elections.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ECI election announcements"
            git push
          else
            echo "ECI feed is unchanged."
          fi

      - name: Prepare GitHub Pages site
        env:
          FEED_REFRESH_STATUS: ${{ steps.refresh_feed.outcome }}
        run: node scripts/prepare-pages.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
